<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Modal Demo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/gmp-resource-sdk@0.0.2-alpha.17/dist/gmp-resource-sdk.js"></script>
</head>
<body>

    <button id="open-modal-btn">打開彈窗</button>

    <div id="modal" class="modal">
        <div class="modal-overlay"></div>
        
        <div class="modal-content">
            <button class="close-btn">&times;</button> 
            <h2>這是一個彈窗</h2>
            <p>這裡是彈窗的內容。你可以放任何東西，例如文字、圖片或表單。</p>
            <img src="京都地鐵.png" alt="京都地鐵">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
